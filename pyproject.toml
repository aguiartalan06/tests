[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netmon"
version = "1.0.0"
description = "Home network monitor: device discovery, port scanning and change tracking against a baseline."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "scapy>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
netmon = "netmon.cli:main"

[tool.setuptools.packages.find]
include = ["netmon*"]

[tool.setuptools.package-data]
netmon = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
